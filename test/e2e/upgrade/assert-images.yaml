# Ready is only meaningful if the Deployments actually run the image for
# $version: the phase machine once declared an upgrade complete after
# relabeling pods that still ran the old binary (#223).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-upgrade-frontend
spec:
  template:
    spec:
      containers:
        - name: temporal
          image: (join(':', ['temporalio/server', $version]))
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-upgrade-history
spec:
  template:
    spec:
      containers:
        - name: temporal
          image: (join(':', ['temporalio/server', $version]))
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-upgrade-matching
spec:
  template:
    spec:
      containers:
        - name: temporal
          image: (join(':', ['temporalio/server', $version]))
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-upgrade-worker
spec:
  template:
    spec:
      containers:
        - name: temporal
          image: (join(':', ['temporalio/server', $version]))
