name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # Decide which suites this PR needs (see hack/ci-changes.sh). Pushes to main
  # and anything that fails to resolve run everything.
  changes:
    name: Detect changes
    runs-on: namespace-profile-temporal-operator
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.classify.outputs.go }}
      e2e: ${{ steps.classify.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "pull_request" ] &&
            files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')"; then
            printf '%s\n' "$files"
            hack/ci-changes.sh <<<"$files" | tee -a "$GITHUB_OUTPUT"
          else
            printf 'go=true\ne2e=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: namespace-profile-temporal-operator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-
      - name: Run linter
        run: make lint

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: namespace-profile-temporal-operator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            bin/k8s
          key: ${{ runner.os }}-test-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-test-
      - name: Run tests
        run: make test

  build:
    name: Build image
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: namespace-profile-temporal-operator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-build-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-build-
      - name: Build container image
        run: make docker-build IMG=temporal-operator:ci

  govulncheck:
    name: govulncheck
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: namespace-profile-temporal-operator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  verify-chart:
    name: Verify generated chart
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: namespace-profile-temporal-operator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-chart-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-chart-
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Regenerate Helm chart
        run: make helm-chart
      - name: Fail if generated chart is stale
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated chart/manifests are out of date (or 'make helm-chart' touched unexpected files). Run 'make helm-chart' and commit the result."
            git --no-pager status --porcelain
            git --no-pager diff
            exit 1
          fi
      - name: Fail if test-chart.yml was resurrected
        run: |
          if [ -f .github/workflows/test-chart.yml ]; then
            echo "::error::.github/workflows/test-chart.yml must not exist; helmgen should delete it."
            exit 1
          fi
      - name: Lint and render chart
        run: |
          helm lint dist/chart
          helm template temporal-operator dist/chart --namespace temporal-system >/dev/null
