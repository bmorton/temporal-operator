version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      go-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # Dev tools built by the Makefile, one Go module per tool. Grouped across
  # all tool directories so a day's updates arrive as a few PRs, not one per
  # dependency per tool. The first matching group wins.
  - package-ecosystem: "gomod"
    directories:
      - "/hack/tools/*"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      # Tools whose output is committed. A bump here needs
      # `make generate manifests helm-chart` re-run by hand, so it is kept
      # apart and does not hold back the other tools.
      tools-codegen:
        applies-to: version-updates
        patterns:
          - "sigs.k8s.io/controller-tools"
          - "sigs.k8s.io/kustomize/*"
          - "sigs.k8s.io/kubebuilder/*"
          - "github.com/elastic/crd-ref-docs"
      tools:
        applies-to: version-updates
        patterns:
          - "*"
      # Security fixes for the tools' transitive dependencies.
      tools-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # kubebuilder 4.11+ generates a different Helm chart layout (renamed
      # values keys, new template helpers) that hack/helmgen and
      # hack/helm/overrides do not handle yet. Remove once the chart is
      # migrated.
      - dependency-name: "sigs.k8s.io/kubebuilder/v4"
        update-types:
          - "version-update:semver-minor"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
      include: "scope"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      docs-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
